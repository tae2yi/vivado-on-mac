<svg xmlns="http://www.w3.org/2000/svg" width="818" height="1024" viewBox="0 0 818 1024" role="img" aria-label="Connect JTAG.command terminal output"><rect width="818" height="1024" rx="10" fill="#1e2127"/><path d="M0 10a10 10 0 0 1 10-10h798a10 10 0 0 1 10 10v24H0z" fill="#2c313a"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/><text x="409.0" y="22" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa3b2">Connect JTAG.command</text><g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><text x="18" y="58" textLength="516.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text><text x="18" y="78" textLength="120.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">┃ JTAG CONNECT</tspan></text><text x="18" y="98" textLength="490.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">┃</tspan><tspan fill="#d8dee9"> </tspan><tspan fill="#d8dee9" font-weight="700">Press Enter within 5 seconds  →  connect the JTAG cable</tspan></text><text x="18" y="118" textLength="567.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">┃</tspan><tspan fill="#d8dee9"> </tspan><tspan fill="#d8dee9" font-weight="700">Do nothing                    →  stop the usbipd daemon and exit</tspan></text><text x="18" y="138" textLength="516.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text><text x="18" y="178" textLength="352.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Looking for a JTAG cable on this Mac...</tspan></text><text x="18" y="198" textLength="464.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">✔ Found cable 03fd:0013 (no firmware yet) at busid 2-1</tspan></text><text x="18" y="218" textLength="266.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">✔ usbipd daemon already running</tspan></text><text x="18" y="238" textLength="387.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Sharing the cable over USB/IP (bind 2-1)...</tspan></text><text x="18" y="258" textLength="765.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b93a1">  macOS left the cable unconfigured (normal for 0013); selecting its USB configuration...</tspan></text><text x="18" y="278" textLength="387.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Sharing the cable over USB/IP (bind 2-1)...</tspan></text><text x="18" y="298" textLength="120.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">✔ Cable shared</tspan></text><text x="18" y="318" textLength="782.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Stopping hw_server first (it must not be talking to the cable while it is re-attached)...</tspan></text><text x="18" y="338" textLength="421.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Removing the old (dead) attachment on port 0...</tspan></text><text x="18" y="358" textLength="412.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Attaching the cable inside vivado_container...</tspan></text><text x="18" y="378" textLength="438.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">✔ Cable attached: 03fd:0013 at /dev/bus/usb/001/014</tspan></text><text x="18" y="398" textLength="369.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Starting hw_server in vivado_container...</tspan></text><text x="18" y="418" textLength="163.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">✔ hw_server running</tspan></text><text x="18" y="458" textLength="516.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#f2c94c" font-weight="700">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text><text x="18" y="478" textLength="430.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#f2c94c" font-weight="700">┃ ⚠ NOT READY YET — please wait (about 30 seconds)</tspan></text><text x="18" y="498" textLength="627.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#f2c94c" font-weight="700">┃</tspan><tspan fill="#d8dee9"> </tspan><tspan fill="#d8dee9" font-weight="700">The cable has no firmware yet (03fd:0013). hw_server is loading it now.</tspan></text><text x="18" y="518" textLength="619.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#f2c94c" font-weight="700">┃</tspan><tspan fill="#d8dee9"> </tspan><tspan fill="#d8dee9" font-weight="700">Do NOT press Auto Connect in Vivado until you see the green READY box.</tspan></text><text x="18" y="538" textLength="516.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#f2c94c" font-weight="700">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text><text x="18" y="578" textLength="464.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#f2c94c" font-weight="700">⏳ 20s  firmware loaded, checking it stays put (8/8)...</tspan></text><text x="18" y="598" textLength="387.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">✔ Firmware loaded: the cable is now 03fd:0008</tspan></text><text x="18" y="618" textLength="421.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Re-attaching the cable with its new identity...</tspan></text><text x="18" y="638" textLength="352.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Looking for a JTAG cable on this Mac...</tspan></text><text x="18" y="658" textLength="309.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">✔ Found cable 03fd:0008 at busid 2-1</tspan></text><text x="18" y="678" textLength="266.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">✔ usbipd daemon already running</tspan></text><text x="18" y="698" textLength="387.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Sharing the cable over USB/IP (bind 2-1)...</tspan></text><text x="18" y="718" textLength="120.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">✔ Cable shared</tspan></text><text x="18" y="738" textLength="782.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Stopping hw_server first (it must not be talking to the cable while it is re-attached)...</tspan></text><text x="18" y="758" textLength="421.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Removing the old (dead) attachment on port 0...</tspan></text><text x="18" y="778" textLength="412.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Attaching the cable inside vivado_container...</tspan></text><text x="18" y="798" textLength="438.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">✔ Cable attached: 03fd:0008 at /dev/bus/usb/001/015</tspan></text><text x="18" y="818" textLength="369.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Starting hw_server in vivado_container...</tspan></text><text x="18" y="838" textLength="163.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">✔ hw_server running</tspan></text><text x="18" y="878" textLength="516.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text><text x="18" y="898" textLength="275.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">┃ ✔ READY — JTAG cable connected</tspan></text><text x="18" y="918" textLength="395.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">┃</tspan><tspan fill="#d8dee9"> </tspan><tspan fill="#d8dee9" font-weight="700">Now in Vivado:  Open Target  →  Auto Connect</tspan></text><text x="18" y="938" textLength="670.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">┃</tspan><tspan fill="#d8dee9"> </tspan><tspan fill="#d8dee9" font-weight="700">When you are done: run &quot;Connect JTAG.command&quot; again and just wait 5 seconds.</tspan></text><text x="18" y="958" textLength="516.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#5fd787" font-weight="700">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text><text x="18" y="998" textLength="292.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b93a1">  This window closes in 5 seconds.</tspan></text></g></svg>