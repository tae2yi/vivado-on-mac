<svg xmlns="http://www.w3.org/2000/svg" width="775" height="544" viewBox="0 0 775 544" role="img" aria-label="Connect JTAG.command terminal output"><rect width="775" height="544" rx="10" fill="#1e2127"/><path d="M0 10a10 10 0 0 1 10-10h755a10 10 0 0 1 10 10v24H0z" fill="#2c313a"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/><text x="387.5" y="22" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa3b2">Connect JTAG.command</text><g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace" font-size="14" xml:space="preserve"><text x="18" y="58" textLength="516.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text><text x="18" y="78" textLength="120.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">┃ JTAG CONNECT</tspan></text><text x="18" y="98" textLength="490.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">┃</tspan><tspan fill="#d8dee9"> </tspan><tspan fill="#d8dee9" font-weight="700">Press Enter within 5 seconds  →  connect the JTAG cable</tspan></text><text x="18" y="118" textLength="567.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">┃</tspan><tspan fill="#d8dee9"> </tspan><tspan fill="#d8dee9" font-weight="700">Do nothing                    →  stop the usbipd daemon and exit</tspan></text><text x="18" y="138" textLength="516.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text><text x="18" y="178" textLength="352.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#56c8d8" font-weight="700">▶ Looking for a JTAG cable on this Mac...</tspan></text><text x="18" y="198" textLength="507.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#f2c94c" font-weight="700">⚠ No supported JTAG cable found. USB devices this Mac sees:</tspan></text><text x="18" y="218" textLength="163.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b93a1">Local USB Device(s)</tspan></text><text x="18" y="238" textLength="154.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#d8dee9">==================</tspan></text><text x="18" y="258" textLength="627.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#d8dee9">Busid  Dev-Node                                    USB Device Information</tspan></text><text x="18" y="278" textLength="722.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#d8dee9">------------------------------------------------------------------------------------</tspan></text><text x="18" y="298" textLength="610.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#d8dee9">1-2         /dev/bus/usb/1/2                174c:2362 (ASMedia ASM236X)</tspan></text><text x="18" y="318" textLength="559.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#d8dee9">2-1         /dev/bus/usb/2/1                0483:374e (STLINK_V3)</tspan></text><text x="18" y="358" textLength="516.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff6b6b" font-weight="700">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text><text x="18" y="378" textLength="86.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff6b6b" font-weight="700">┃ ✖ FAILED</tspan></text><text x="18" y="398" textLength="189.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff6b6b" font-weight="700">┃</tspan><tspan fill="#d8dee9"> </tspan><tspan fill="#d8dee9" font-weight="700">No JTAG cable found.</tspan></text><text x="18" y="418" textLength="533.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff6b6b" font-weight="700">┃</tspan><tspan fill="#d8dee9"> </tspan><tspan fill="#d8dee9" font-weight="700">1. Plug the JTAG cable (and its USB-C adapter) into the Mac.</tspan></text><text x="18" y="438" textLength="326.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff6b6b" font-weight="700">┃</tspan><tspan fill="#d8dee9"> </tspan><tspan fill="#d8dee9" font-weight="700">2. Run &quot;Connect JTAG.command&quot; again.</tspan></text><text x="18" y="458" textLength="739.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff6b6b" font-weight="700">┃</tspan><tspan fill="#d8dee9"> </tspan><tspan fill="#d8dee9" font-weight="700">Cable LED on but still not found? Unplug the ADAPTER at the Mac and plug it back in.</tspan></text><text x="18" y="478" textLength="516.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff6b6b" font-weight="700">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text><text x="18" y="518" textLength="301.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b93a1">  Press Enter to close this window.</tspan></text></g></svg>